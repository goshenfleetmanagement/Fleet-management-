name: Deploy smooth-action Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/smooth-action/**"
      - ".github/workflows/deploy-smooth-action.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: cpfippqprzmjdqzwnwyg
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy smooth-action
        run: supabase functions deploy smooth-action --project-ref "$PROJECT_ID" --yes
